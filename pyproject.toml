[project]
name = "svg-to-gcode"
version = "0.1.0"
description = "Turn images and SVGs into G-code and draw them on paper with the Owl 6.9 arm"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "contourpy>=1.4.0",
    "mujoco>=3.15.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyserial>=3.5",
    "pyzmq>=27.2.0",
    "scipy>=1.18.1",
    "svgelements>=1.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
live = ["sounddevice>=0.5.3"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.hatch.build]
# The copies of control/tools in tools/ import each other by top-level name.
dev-mode-dirs = [".", "tools"]

[tool.ruff]
src = [".", "tools"]
# Verbatim copies of control/tools; keep them diffable against upstream.
extend-exclude = ["robot_interface.py", "motion.py", "prepare_owl69_model.py", "conveyor.py"]
